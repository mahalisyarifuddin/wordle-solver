<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wordle Solver</title>
  <link rel="icon" href="data:,"/>

  <script src="https://code.jquery.com/jquery-2.1.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.4/lodash.min.js"></script>
  <script src="lib/scenery.min.js"></script>
  <script src="lib/he-1.1.1.js"></script>
  <script src="lib/himalaya-1.1.0.js"></script>
  <script src="lib/flatqueue-1.2.1.js"></script>

  <style>
    html, body {
      background-color: #fff;
      border: 0;
      padding: 0;
      /* allow touch scrolling/zooming on mobile; the solver only needs taps */
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba( 0, 0, 0, 0 );
    }
    /* scenery sets touch-action:none inline on its display element, which would
       block page scrolling on phones. Override it (taps still work fine). */
    #main {
      touch-action: manipulation !important;
    }
  </style>
</head>
<body>

  <div id="main" style="position: absolute; left: 0; top: 0;">
  </div>

  <script type="module">
    // import scenery from '../chipper/dist/js/scenery/js/main.js';
    // import dot from '../chipper/dist/js/dot/js/main.js';
    // import axon from '../chipper/dist/js/axon/js/main.js';
    // import phetCore from '../chipper/dist/js/phet-core/js/main.js';

    import totalTiareTree from './data/tiare.tree.total.js';
    import totalTroneTree from './data/trone.tree.total.js';
    import totalTraceTree from './data/trace.tree.total.js';
    import totalTorseTree from './data/torse.tree.total.js';
    import totalTarseTree from './data/tarse.tree.total.js';
    import totalRoateTree from './data/roate.tree.total.js';

    import minRatedTree from './data/rated.tree.js';
    import minRanidTree from './data/ranid.tree.js';
    import minRantsTree from './data/rants.tree.js';
    import minSanerTree from './data/saner.tree.js';
    import minManetTree from './data/manet.tree.js';
    import minLanesTree from './data/lanes.tree.js';

    import hardTiareTree from './data/tiare.tree.hard.js';
    import hardTroneTree from './data/trone.tree.hard.js';
    import hardTraceTree from './data/trace.tree.hard.js';
    import hardTorseTree from './data/torse.tree.hard.js';
    import hardToresTree from './data/tores.tree.hard.js';
    import hardTarseTree from './data/tarse.tree.hard.js';

    // Corpus-weighted SoG capped knee (gamma = 0.45, lambda = 1.0).
    import cappedToiseTree from './data/toise.tree.capped.js';
    import cappedTraceTree from './data/trace.tree.capped.js';
    import cappedToileTree from './data/toile.tree.capped.js';
    import cappedTroneTree from './data/trone.tree.capped.js';
    import cappedSoareTree from './data/soare.tree.capped.js';
    import cappedThaleTree from './data/thale.tree.capped.js';

    import cappedHardTraceTree from './data/trace.tree.hard.capped.js';
    import cappedHardToiseTree from './data/toise.tree.hard.capped.js';
    import cappedHardTroneTree from './data/trone.tree.hard.capped.js';
    import cappedHardToileTree from './data/toile.tree.hard.capped.js';
    import cappedHardSoareTree from './data/soare.tree.hard.capped.js';
    import cappedHardTorseTree from './data/torse.tree.hard.capped.js';

    import targetWords from './data/targetWords.js';

    const fontFamily = "'Clear Sans', 'Helvetica Neue', Arial, sans-serif";
    const black = new scenery.Color( '#1A1A1B' );
    const gray = new scenery.Color( '#787C7E' );
    const yellow = new scenery.Color( '#C9B458' );
    const green = new scenery.Color( '#6AAA64' );

    const LENGTH = 5;
    const ABSENT = 0;
    const PRESENT = 1;
    const CORRECT = 2;
    const scratchResult = [ ABSENT, ABSENT, ABSENT, ABSENT, ABSENT ];
    const scratchIncorrect = [ true, true, true, true, true ];
    const scratchUnused = [ true, true, true, true, true ];
    const computeScore = ( correctSolution, attempt ) => {
      const result = scratchResult.fill( ABSENT ); // indexed by attempt
      const incorrect = scratchIncorrect.fill( true ); // indexed by correctSolution
      const unused = scratchUnused.fill( true ); // indexed by attempt

      for ( let i = 0; i < LENGTH; i++ ) {
        if ( correctSolution[ i ] === attempt[ i ] ) {
          result[ i ] = CORRECT;
          incorrect[ i ] = false;
          unused[ i ] = false;
        }
      }

      for ( let i = 0; i < LENGTH; i++ ) {
        if ( incorrect[ i ] ) {
          const correctLetter = correctSolution[ i ];
          for ( let k = 0; k < LENGTH; k++ ) {
            if ( unused[ k ] && correctLetter === attempt[ k ] ) {
              result[ k ] = PRESENT;
              unused[ k ] = false;
              break;
            }
          }
        }
      }

      return result.join( '' );
    };

    const computePartition = ( words, guess ) => {
      const map = {};
      for ( let i = 0; i < words.length; i++ ) {
        const word = words[ i ];
        const match = score( word, guess );
        let list = map[ match ];
        if ( !list ) {
          list = map[ match ] = [];
        }
        list.push( word );
      }
      return map;
    };

    const computeAverageGuesses = tree => {
      let averageGuesses = 0;
      let total = 0;
      for ( let i = 0; i < tree.ranking.counts.length; i++ ) {
        total += tree.ranking.counts[ i ];
        averageGuesses += ( i + 1 ) * tree.ranking.counts[ i ];
      }
      averageGuesses /= total;
      return averageGuesses;
    }

    const computeAverageYellows = tree => {
      if ( tree.ranking.yellows === undefined ) return null;
      let total = 0;
      for ( let i = 0; i < tree.ranking.counts.length; i++ ) {
        total += tree.ranking.counts[ i ];
      }
      return tree.ranking.yellows / total;
    }

    class StaticWordNode extends scenery.FlowBox {
      constructor( word, score, options ) {
        super( phetCore.merge( {
          spacing: 5,
          mouseArea: new dot.Bounds2( 0, 0, 330, 62 ),
          touchArea: new dot.Bounds2( 0, 0, 330, 62 ),
          children: word.split( '' ).map( ( letter, index ) => {
            // TODO: factor out below?
            return new scenery.Rectangle( 0, 0, 62, 62, {
              fill: { 0: gray, 1: yellow, 2: green }[ score[ index ] ],
              children: [
                new scenery.Text( letter.toUpperCase(), { fontSize: 32, fontFamily: fontFamily, fontWeight: '700', fill: 'white', centerX: 32, centerY: 32 } )
              ]
            } )
          } )
        }, options ) );
      }
    }

    class WordOptionsNode extends scenery.Node {
      constructor( tree, words, depth, scoreProperty ) {
        const scores = Object.keys( tree.map ).sort();
        const rows = Math.max( 1, Math.floor( Math.sqrt( scores.length ) - 0.5 ) );
        const xSpacing = 20;
        const ySpacing = 5;

        super();

        const childNode = new scenery.Node( { scale: 0.5 } );
        this.addChild( childNode );

        const highlightAmount = 5;
        const highlightRectangle = new scenery.Rectangle( { stroke: black, lineWidth: highlightAmount / 2 } );

        scores.forEach( ( score, index ) => {
          const row = index % rows;
          const col = Math.floor( index / rows );

          const wordNode = new StaticWordNode( tree.guess, score, { cursor: 'pointer' } );
          wordNode.addInputListener( new scenery.FireListener( {
            fire: () => {
              scoreProperty.value = score;
            }
          } ) );

          wordNode.x = col * ( wordNode.width + xSpacing );
          wordNode.y = row * ( wordNode.height + ySpacing );
          childNode.addChild( wordNode );

          scoreProperty.link( otherScore => {
            wordNode.opacity = otherScore === score ? 1 : 0.6;
            if ( otherScore === score ) {
              highlightRectangle.rectBounds = wordNode.bounds.dilated( highlightAmount );
            }
          } );
        } );

        childNode.localBounds = childNode.localBounds.dilated( 10 );

        childNode.addChild( highlightRectangle );

        // Yes, this is a blatant memory leak, set up disposal
        display.sizeProperty.link( size => {
          this.maxWidth = Math.min( size.width - 20, 700 );
        } );
      }
    }

    class WordNode extends scenery.FlowBox {
      constructor( tree, words, depth, history = [], options ) {
        options = phetCore.merge( {
          orientation: 'vertical',
          spacing: 2
        }, options );
        super( options );

        const isLeaf = typeof tree === 'string';

        const guess = isLeaf ? tree : tree.guess;

        const scoreProperty = new axon.Property( isLeaf ? '22222' : '00000' );
        // const scoreProperty = new phet.axon.Property( isLeaf ? '22222' : ( tree.map[ '00000' ] ? '00000' : Object.keys( tree.map )[ 0 ] ) );

        const letterNodes = guess.split( '' ).map( ( letter, index ) => {
          let value = 0;

          const letterNode = new scenery.Rectangle( 0, 0, 62, 62, {
            fill: isLeaf ? green : gray,
            children: [
              new scenery.Text( letter.toUpperCase(), { fontSize: 32, fontFamily: fontFamily, fontWeight: '700', fill: 'white', centerX: 32, centerY: 32 } )
            ],
            cursor: 'pointer'
          } );
          scoreProperty.link( score => {
            letterNode.fill = { 0: gray, 1: yellow, 2: green }[ score[ index ] ]
          } );
          !isLeaf && letterNode.addInputListener( new scenery.FireListener( {
            fire: () => {
              value = ( value + 1 ) % 3;
              scoreProperty.value = scoreProperty.value.slice( 0, index ) + value + scoreProperty.value.slice( index + 1 );
            }
          } ) );
          return letterNode;
        } );

        const letterBox = new scenery.FlowBox( {
          spacing: 5,
          children: letterNodes
        } );

        this.addChild( letterBox );

        if ( !isLeaf ) {
          const avgYellows = computeAverageYellows( tree );
          const yellowText = avgYellows !== null ? `, ${avgYellows.toFixed( 2 )} avg. yellows` : '';
          this.addChild( new scenery.Text( `${computeAverageGuesses( tree ).toFixed( 2 )} ${depth === 1 ? 'total avg. guesses' : 'avg. guesses left'}, ${words.length} words${yellowText}, ${Object.values( tree.map ).length} colorings`, { fontSize: 14, fontFamily: fontFamily, fill: gray } ) );
        }
        else {
          this.addChild( new scenery.Text( `solved`, { fontSize: 14, fontFamily: fontFamily, fill: gray, layoutOptions: { topMargin: 5 } } ) );
        }

        const copyButton = new scenery.Text( 'Copy as text', {
          fontSize: 14,
          fontFamily: fontFamily,
          fill: 'rgb(27,0,241)',
          cursor: 'pointer',
          layoutOptions: { topMargin: 5 }
        } );
        const copyText = text => {
          // navigator.clipboard requires a secure context (https or localhost);
          // fall back to the execCommand path for file:// or http:// (e.g. opening
          // the standalone from a phone's downloads folder).
          if ( navigator.clipboard && window.isSecureContext ) {
            return navigator.clipboard.writeText( text ).catch( () => copyTextFallback( text ) );
          }
          return copyTextFallback( text );
        };
        const copyTextFallback = text => {
          const textarea = document.createElement( 'textarea' );
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild( textarea );
          textarea.select();
          try {
            document.execCommand( 'copy' );
          }
          catch ( e ) {
            // ignore - nothing else we can do
          }
          document.body.removeChild( textarea );
        };
        copyButton.addInputListener( new scenery.FireListener( {
          fire: () => {
            const currentHistory = [ ...history, { guess, score: scoreProperty.value } ];
            const text = currentHistory.map( entry => {
              return entry.guess.split( '' ).map( ( letter, i ) => {
                const color = { 0: 'black', 1: 'yellow', 2: 'green' }[ entry.score[ i ] ];
                return `${letter.toUpperCase()}(${color})`;
              } ).join( ' ' );
            } ).join( '\n' );
            copyText( text );

            copyButton.fill = black;
            setTimeout( () => { copyButton.fill = 'rgb(27,0,241)'; }, 1000 );
          }
        } ) );
        this.addChild( copyButton );

        if ( !isLeaf ) {
          this.addChild( new WordOptionsNode( tree, words, depth, scoreProperty ) );
        }

        if ( !isLeaf ) {
          const childNode = new scenery.Node( {
            layoutOptions: {
              topMargin: 15
            }
          } );
          this.addChild( childNode );

          scoreProperty.lazyLink( score => {
            if ( !tree.map[ score ] ) {
              childNode.children = [ new scenery.Text( 'no match found', { fontSize: 14, fontFamily: fontFamily, fill: gray } ) ];
            }
            else if ( score !== '22222' ) {
              childNode.children = [ new WordNode( tree.map[ score ], words.filter( word => computeScore( word, guess ) === score ), depth + 1, [ ...history, { guess, score } ] ) ];
            }
            else {
              childNode.children = [];
            }
          } );
        }
      }
    }

    const treeProperty = new axon.Property( null );
    window.treeProperty = treeProperty;

    const scene = new scenery.Node();
    const display = new scenery.Display( scene, {
      container: document.getElementById( 'main' ),
      rootRenderer: 'svg',
      // allowSceneOverflow: false,
      // assumeFullWindow: true
      allowCSSHacks: false,
      passiveEvents: true
    } );
    display.domElement.style.position = 'absolute';
    window.display = display;

    const wordNodeContainer = new scenery.Node( {
      layoutOptions: { topMargin: 15 }
    } );
    treeProperty.link( tree => {
      if ( tree === null ) {
        wordNodeContainer.removeAllChildren();
      }
      else {
        wordNodeContainer.children = [ new WordNode( tree, targetWords, 1 ) ];
      }
    } );

    const helpText = new scenery.RichText( 'Click one of the starting guesses, I\'ll give you the rest!<br><br>Click the letters to change the color to match your result, then you\'ll be given another guess (or click a thumbnail option below).<br><br>Optimized over the 14,855-word dictionary with uniform or empirical English word-frequency priors (wordfreq data, conditioned on official Wordle answers). <a href="{{about}}">Learn More</a>.', {
      lineWrap: 450,
      font: new scenery.Font( { size: 14, family: fontFamily } ),
      layoutOptions: { topMargin: 15 },
      links: { about: 'https://jonathanolson.net/experiments/optimal-wordle-solutions' }
    } );

    const selectionHeaderFont = new scenery.Font( { size: 14, fontFamily: fontFamily } );

    const createTreeButton = ( tree, labelText ) => {
      const label = new scenery.RichText( `<u>${( labelText || tree.guess ).toUpperCase()}</u>`, {
        font: new scenery.Font( { size: 14, fontFamily: fontFamily, weight: '700' } ),
        cursor: 'pointer',
        fill: 'rgb(27,0,241)'
      } );

      label.addInputListener( new scenery.FireListener( {
        fire: () => {
          treeProperty.value = tree;
          // helpText.visible = false;
        }
      } ) );

      return label;
    };

    const mainBox = new scenery.FlowBox( {
      orientation: 'vertical',
      children: [
        new scenery.RichText( 'WORDLE<span style="color: #6AAA64;">Solver</span>', { font: new scenery.Font( { size: 36, family: fontFamily, weight: '700' } ), fill: black } ),
        helpText,
        new scenery.HBox( {
          layoutOptions: { topMargin: 10 },
          align: 'top',
          spacing: 12,
          children: [
            new scenery.FlowBox( {
              orientation: 'vertical',
              children: [
                new scenery.Text( 'Fastest Average', { font: selectionHeaderFont, fill: gray, layoutOptions: { bottomMargin: 5 } } ),
                createTreeButton( totalTorseTree, 'TORSE' ),
                createTreeButton( totalTroneTree, 'TRONE' ),
                createTreeButton( totalTraceTree, 'TRACE' ),
                createTreeButton( totalTiareTree, 'TIARE' ),
                createTreeButton( totalRoateTree, 'ROATE' ),
                createTreeButton( totalTarseTree, 'TARSE' )
              ]
            } ),
            new scenery.FlowBox( {
              orientation: 'vertical',
              children: [
                new scenery.Text( 'Fewest', { font: selectionHeaderFont, fill: gray, layoutOptions: { bottomMargin: 5 } } ),
                createTreeButton( minRanidTree, 'RANID' ),
                createTreeButton( minRantsTree, 'RANTS' ),
                createTreeButton( minManetTree, 'MANET' ),
                createTreeButton( minSanerTree, 'SANER' ),
                createTreeButton( minRatedTree, 'RATED' ),
                createTreeButton( minLanesTree, 'LANES' )
              ]
            } ),
            new scenery.FlowBox( {
              orientation: 'vertical',
              children: [
                new scenery.Text( 'Hard Mode', { font: selectionHeaderFont, fill: gray, layoutOptions: { bottomMargin: 5 } } ),
                createTreeButton( hardTraceTree, 'TRACE' ),
                createTreeButton( hardTroneTree, 'TRONE' ),
                createTreeButton( hardTiareTree, 'TIARE' ),
                createTreeButton( hardTorseTree, 'TORSE' ),
                createTreeButton( hardTarseTree, 'TARSE' ),
                createTreeButton( hardToresTree, 'TORES' )
              ]
            } ),
            new scenery.FlowBox( {
              orientation: 'vertical',
              children: [
                new scenery.Text( 'SoG Capped Knee', { font: selectionHeaderFont, fill: gray, layoutOptions: { bottomMargin: 5 } } ),
                createTreeButton( cappedToiseTree, 'TOISE' ),
                createTreeButton( cappedThaleTree, 'THALE' ),
                createTreeButton( cappedTraceTree, 'TRACE' ),
                createTreeButton( cappedToileTree, 'TOILE' ),
                createTreeButton( cappedSoareTree, 'SOARE' ),
                createTreeButton( cappedTroneTree, 'TRONE' )
              ]
            } ),
            new scenery.FlowBox( {
              orientation: 'vertical',
              children: [
                new scenery.Text( 'SoG Capped Knee Hard', { font: selectionHeaderFont, fill: gray, layoutOptions: { bottomMargin: 5 } } ),
                createTreeButton( cappedHardTraceTree, 'TRACE (Hard)' ),
                createTreeButton( cappedHardToileTree, 'TOILE (Hard)' ),
                createTreeButton( cappedHardToiseTree, 'TOISE (Hard)' ),
                createTreeButton( cappedHardTroneTree, 'TRONE (Hard)' ),
                createTreeButton( cappedHardSoareTree, 'SOARE (Hard)' ),
                createTreeButton( cappedHardTorseTree, 'TORSE (Hard)' )
              ]
            } ),
          ]
        } ),
        wordNodeContainer
      ]
    } );
    scene.addChild( mainBox );
    mainBox.localBoundsProperty.link( localBounds => {
      mainBox.centerX = window.innerWidth / 2;
    } );

    display.initializeEvents();

    let resizeDirty = true;
    const resizer = () => {
      resizeDirty = true;
    };
    window.addEventListener( 'resize', resizer );
    scene.boundsProperty.link( resizer );

    display.updateOnRequestAnimationFrame( dt => {
      if ( resizeDirty && scene.bounds.isFinite() ) {
        resizeDirty = false;

        display.setWidthHeight( window.innerWidth, Math.ceil( mainBox.bounds.height + 10 ) );
      }
    } );

  </script>
</body>
</html>
